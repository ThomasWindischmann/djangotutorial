{% load static %}
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ question.question_text }}</title>
    <link rel="stylesheet" href="{% static 'polls/style.css' %}">
</head>
<body>
<div class="page-shell">
<header class="site-header">
    <a class="brand" href="{% url 'polls:index' %}">Polls</a>
    <span class="header-mark" aria-hidden="true"></span>
</header>
<main>
<p class="eyebrow">Deine Stimme</p>
<section class="poll-panel">
<form action="{% url 'polls:vote' question.id %}" method="post">
{% csrf_token %}
<fieldset>
    <legend><h1>{{ question.question_text }}</h1></legend>
    {% if error_message %}<p class="error"><strong>{{ error_message }}</strong></p>{% endif %}
    {% for choice in question.choice_set.all %}
        <label class="choice" for="choice{{ forloop.counter }}">
            <input type="radio" name="choice" id="choice{{ forloop.counter }}" value="{{ choice.id }}">
            <span>{{ choice.choice_text }}</span>
        </label>
    {% endfor %}
</fieldset>
<button class="button" type="submit">Stimme abgeben</button>
</form>
</section>
<a class="home-button" href="{% url 'polls:index' %}">Zur Übersicht</a>
</main>
</div>
</body>
</html>
